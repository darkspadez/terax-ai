name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      actions: read
      contents: write
      id-token: write
    # `platform` names the leg (the steps below branch on it); `runner` is the
    # Namespace profile it builds on (see ci.yml). The Linux profiles run
    # Ubuntu 26.04, so the Linux legs build inside an ubuntu:22.04 container:
    # a binary needs at least the glibc it was built against, and 22.04 keeps
    # the packages starting on Ubuntu 22.04+, Debian 12, Fedora 36+ and the
    # like. An empty `container` runs the leg on the runner itself. There is
    # no Windows profile yet: the Windows leg is left out until one exists,
    # and its SignPath steps below stay for when it returns.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            runner: namespace-profile-oarlock-macos-arm64
            container: ""
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            runner: namespace-profile-oarlock-macos-arm64
            container: ""
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            runner: namespace-profile-oarlock-linux-amd64
            container: ubuntu:22.04
            args: ""
            rust-target: ""
            appimage-arch: x86_64
          - platform: ubuntu-22.04-arm
            runner: namespace-profile-oarlock-linux-arm64
            container: ubuntu:22.04
            args: ""
            rust-target: ""
            appimage-arch: aarch64

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      # No FUSE inside the container: AppImage tools unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # The container starts bare (and as root, without sudo), so its build
      # dependencies, git (for a real checkout) and the GitHub CLI (used by the
      # AppImage repack) come first.
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            unzip \
            wget \
            xz-utils
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # A container leg may not see the runner's cache volume; a release then
      # builds without the cache rather than failing.
      - uses: namespacelabs/nscloud-cache-action@v1
        continue-on-error: ${{ matrix.container != '' }}
        with:
          cache: |
            bun
            rust
          path: src-tauri/target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Write Apple API key to disk
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Terax ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install."
          releaseDraft: true
          prerelease: false
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # its .sig are re-uploaded here; the updater manifest is patched in the
      # patch-appimage-updater job after all matrix legs finish, so a parallel
      # macOS/Windows upload cannot clobber the combined latest.json.
      - name: Fix AppImage wayland libs and re-sign
        if: startsWith(matrix.platform, 'ubuntu') && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          test -x squashfs-root/usr/bin/terax \
            || { echo "terax binary missing from AppImage"; exit 1; }

          # linuxdeploy may already exclude some of these libraries.
          find squashfs-root \( -type f -o -type l \) \
            -name 'libwayland-*.so*' -print -delete

          ARCH="${{ matrix.appimage-arch }}"
          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool.AppImage
          ARCH="$ARCH" ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland-*.so*' -print -quit | grep -q .; then
            echo "Wayland library still present after repack"
            exit 1
          fi
          test -x squashfs-root/usr/bin/terax \
            || { echo "terax binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"

          TAG="${GITHUB_REF_NAME}"
          rm -f "$APPIMAGE.sig"
          # The updater signature exists only while updates are on (a signing
          # key is configured); without one the repacked AppImage goes up alone.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            bun run tauri signer sign "$APPIMAGE"
            gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release upload "$TAG" "$APPIMAGE" \
              --clobber --repo "$GITHUB_REPOSITORY"
          fi

      # SignPath Authenticode-signs the Windows installers. Their bytes change,
      # so the minisign updater signatures tauri-action produced over the
      # unsigned files no longer match. We stage the installers under the exact
      # names the SignPath artifact configuration expects, submit them, then
      # re-run the tauri signer over the SIGNED files and re-upload both the
      # installers and their new .sig. latest.json is patched in the final
      # patch-updater-manifest job, after every matrix leg has merged, so a
      # parallel macOS/Linux upload cannot clobber the Windows signatures.
      - name: Stage Windows installers for SignPath
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = "src-tauri/target/release/bundle"
          $exe = Get-ChildItem "$bundleDir/nsis" -Filter *.exe | Select-Object -First 1
          $msi = Get-ChildItem "$bundleDir/msi"  -Filter *.msi | Select-Object -First 1
          if (-not $exe) { throw "No NSIS .exe produced by Tauri" }
          if (-not $msi) { throw "No .msi produced by Tauri" }
          New-Item -ItemType Directory -Path signpath-staging -Force | Out-Null
          Copy-Item $exe.FullName signpath-staging/terax-setup.exe
          Copy-Item $msi.FullName signpath-staging/terax.msi
          "EXE_REAL_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
          "MSI_REAL_PATH=$($msi.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Upload unsigned Windows artifact
        id: upload-windows
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: signpath-staging/
          if-no-files-found: error

      # Requires manual approval in the SignPath UI for the production policy.
      # The default wait timeout is 600s; bumped so the job survives the time
      # it takes to review and approve the request during a release.
      - name: Submit Windows installers to SignPath
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'df665bf4-9b76-41ae-9596-1ba3a23010aa'
          project-slug: 'terax-ai'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'signed'

      - name: Re-sign updater and upload signed Windows installers
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $signedExe = "signed/terax-setup.exe"
          $signedMsi = "signed/terax.msi"
          foreach ($f in @($signedExe, $signedMsi)) {
            if (-not (Test-Path $f)) { throw "Signed artifact missing: $f" }
            $sig = Get-AuthenticodeSignature $f
            if ($null -eq $sig.SignerCertificate) { throw "$f is NOT Authenticode-signed" }
            if ($sig.Status -ne 'Valid') { throw "$f signature status: $($sig.Status)" }
            Write-Host "OK $f -> $($sig.SignerCertificate.Subject)"
          }
          Copy-Item $signedExe $env:EXE_REAL_PATH -Force
          Copy-Item $signedMsi $env:MSI_REAL_PATH -Force
          Remove-Item "$($env:EXE_REAL_PATH).sig" -ErrorAction SilentlyContinue
          Remove-Item "$($env:MSI_REAL_PATH).sig" -ErrorAction SilentlyContinue
          bun run tauri signer sign $env:EXE_REAL_PATH
          bun run tauri signer sign $env:MSI_REAL_PATH
          gh release upload $env:GITHUB_REF_NAME `
            $env:EXE_REAL_PATH "$($env:EXE_REAL_PATH).sig" `
            $env:MSI_REAL_PATH "$($env:MSI_REAL_PATH).sig" `
            --clobber --repo $env:GITHUB_REPOSITORY

  # Patch the re-signed AppImages and SignPath-signed Windows signatures into
  # the combined updater manifest. Runs once, after every matrix leg has
  # finished merging its platform into latest.json, so it operates on the full
  # manifest and cannot be clobbered by a parallel upload. Each platform key is
  # patched only when its leg ran and signed (no Windows leg for now), and the
  # job does nothing while updates are off and there is no latest.json.
  patch-updater-manifest:
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: namespace-profile-oarlock-linux-amd64
    permissions:
      contents: write
    steps:
      - name: Patch latest.json with re-signed AppImage and Windows signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # latest.json exists only while updates are on (tauri-action writes
          # it when updater artifacts are built); nothing to patch otherwise.
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "latest.json" --clobber; then
            echo "No latest.json in $TAG: updates are off, nothing to patch."
            exit 0
          fi

          # Re-signing an artifact re-uploads it with --clobber, which deletes
          # and recreates the asset under a new id. tauri-action baked the old
          # asset-id API urls into latest.json, so the urls of re-signed
          # artifacts are rewritten to the stable tag+filename download url.
          # Each platform is patched only when its signature is in the release.
          patch() { # key file-glob
            local key="$1" glob="$2" sig file
            sig=$(ls $glob 2>/dev/null | head -n1) || true
            [ -n "$sig" ] || return 0
            file=$(basename "$sig" .sig)
            jq --arg key "$key" --arg s "$(cat "$sig")" --arg u "$DL/$file" '
              if .platforms[$key] then .platforms[$key] += {signature: $s, url: $u}
              else . end' latest.json > latest.json.tmp
            mv latest.json.tmp latest.json
          }

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            --pattern "*.AppImage.sig" --pattern "*_x64-setup.exe.sig" \
            --pattern "*_x64_en-US.msi.sig" || true

          patch linux-x86_64 "./*_amd64.AppImage.sig"
          patch linux-x86_64-appimage "./*_amd64.AppImage.sig"
          patch linux-aarch64 "./*_aarch64.AppImage.sig"
          patch linux-aarch64-appimage "./*_aarch64.AppImage.sig"
          patch windows-x86_64-msi "./*_x64_en-US.msi.sig"
          patch windows-x86_64-nsis "./*_x64-setup.exe.sig"

          # The generic windows-x86_64 key mirrors whichever installer Tauri
          # picked as primary; its current signature names that file.
          if jq -e '.platforms["windows-x86_64"]' latest.json >/dev/null; then
            GEN_FILE=$(jq -r '.platforms["windows-x86_64"].signature' latest.json \
              | base64 -d | grep -oE 'file:[^[:space:]]+' | head -n1)
            GEN_FILE=${GEN_FILE#file:}
            case "$GEN_FILE" in
              *.msi) patch windows-x86_64 "./*_x64_en-US.msi.sig" ;;
              *)     patch windows-x86_64 "./*_x64-setup.exe.sig" ;;
            esac
          fi

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
