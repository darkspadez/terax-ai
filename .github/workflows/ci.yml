name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Audit (advisory)
        run: bun audit --prod --audit-level=high
        continue-on-error: true

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: React Compiler healthcheck (advisory)
        run: bun run react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        run: bun run build

      - name: Size budget
        run: bun run size

      - name: Dead code (advisory)
        run: bun run knip
        continue-on-error: true

  terminal-platforms:
    name: terminal-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Terminal models, input, blocks, transport, and renderer lifecycle
        run: bun run vitest run src/modules/terminal

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fish \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        working-directory: src-tauri
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked

      - name: fish shell integration
        run: fish --no-config src-tauri/src/modules/pty/scripts/init.test.fish

  rust-platforms:
    name: rust-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked --retries 2

  coverage:
    runs-on: ubuntu-22.04
    needs: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: coverage

      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: src-tauri/lcov.info
          if-no-files-found: error
